<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InfOne 字体排版</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
<main>
  <header class="page-header">
    <span class="eyebrow">INFONE DESIGN SYSTEM</span>
    <h1>InfOne 字体排版</h1>
    <p>覆盖正文、导航、品牌字标、展示标题与等宽代码的字体层级。</p>
  </header>
  <section class="content-group" aria-labelledby="type-system">
    <header class="group-header"><h2 id="type-system">字体层级</h2><span>4</span></header>
    <div class="grid">
      <article class="card"><header class="card-header"><h3>正文与界面文字</h3><p>中文系统字体栈，使用 11、12、13、15、18、24、32、48px 的统一阶梯。</p></header><div class="preview-frame"><iframe loading="lazy" title="正文与界面文字" src="foundation-cards/type-body.html" style="height:290px"></iframe></div></article>
      <article class="card"><header class="card-header"><h3>品牌字标与导航</h3><p>Sora 700 用于品牌字标，导航使用系统 UI 中等字重。</p></header><div class="preview-frame"><iframe loading="lazy" title="品牌字标与导航" src="foundation-cards/type-brand-nav.html" style="height:240px"></iframe></div></article>
      <article class="card"><header class="card-header"><h3>展示标题</h3><p>系统字体栈 700 字重，用于页面和关键数据的展示型标题。</p></header><div class="preview-frame"><iframe loading="lazy" title="展示标题" src="foundation-cards/type-display.html" style="height:260px"></iframe></div></article>
      <article class="card"><header class="card-header"><h3>等宽代码</h3><p>IBM Plex Mono 12–13px，仅用于代码、URL、密钥与模型 ID；业务数字保持 UI 字体。</p></header><div class="preview-frame"><iframe loading="lazy" title="等宽代码" src="foundation-cards/type-mono.html" style="height:280px"></iframe></div></article>
    </div>
  </section>
</main>
</body>
</html>
