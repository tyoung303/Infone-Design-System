<!doctype html>
<!-- @dsCard group="Type" name="Type · Body & UI" subtitle="Chinese body stack: 24 / 16 / 13 / 12" viewport="700x290" -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Body & UI Type</title>
<link rel="stylesheet" href="preview.css">
<style>
  .panel {
    background: var(--th-white);
    border: var(--th-border-card);
    border-radius: var(--th-radius-md);
    padding: 22px 26px;
    display: grid;
    grid-template-columns: 1fr 220px;
    column-gap: 28px;
    row-gap: 10px;
    align-items: baseline;
  }
  .panel .spec {
    font-family: var(--th-font-cn);
    color: var(--color-fg);
  }
  .panel .meta {
    font-family: var(--th-font-ui);
    font-size: 11px;
    color: var(--color-fg-muted);
  }
  .meta b { color: var(--color-fg); font-weight: 600; }
  .s24 { font-size: 24px; font-weight: 600; line-height: 1.2; }
  .s16 { font-size: 16px; font-weight: 500; line-height: 1.3; }
  .s14 { font-size: 13px; font-weight: 400; line-height: 1.5; }
  .s13 { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .s12 { font-size: 13px; font-weight: 400; line-height: 1.5; color: var(--color-fg-muted); }
</style>
</head>
<body>
<div class="card">
  <div class="panel">
    <div class="spec s24">账户数据</div>
    <div class="meta">h3 · <b>24/29</b> · 600</div>

    <div class="spec s16">下午好，admin</div>
    <div class="meta">h4 · <b>16/21</b> · 500 · greeting</div>

    <div class="spec s14">将模型地址替换为 localhost:3000 即可开始转发请求</div>
    <div class="meta">body · <b>13/20</b> · 400</div>

    <div class="spec s13">令牌管理</div>
    <div class="meta">card title · <b>13/18</b> · 500</div>

    <div class="spec s12">当前余额 · 模型广场 · 一级标题</div>
    <div class="meta">caption · <b>13/18</b> · 400</div>
  </div>
</div>
</body>
</html>
