<!doctype html>
<!-- @dsCard group="Spacing" name="Z-index scale" subtitle="Stacking order — nav · dropdown · overlay · modal · tooltip · toast" viewport="700x220" -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Z-index scale</title>
<link rel="stylesheet" href="preview.css">
<style>
.panel{display:flex;flex-direction:column;gap:10px;padding:22px 16px 26px;background:var(--th-bg);border-radius:var(--th-radius-md)}
.row{display:grid;grid-template-columns:140px 48px 1fr;align-items:center;gap:14px;padding:8px 10px;background:var(--th-white);border:0.5px solid var(--color-border);border-radius:var(--th-radius-sm)}
.tok{font-family:var(--th-font-mono);font-size:12px;color:var(--color-fg);font-weight:600}
.val{font-family:var(--th-font-mono);font-size:13px;color:var(--th-teal-600);text-align:center}
.note{font-size:11px;color:var(--color-fg-muted)}
</style>
</head>
<body>
<div class="card flush">
<div class="panel">
<div class="row"><span class="tok">--z-nav</span><span class="val">30</span><span class="note">Sticky 48px top nav</span></div>
<div class="row"><span class="tok">--z-dropdown</span><span class="val">40</span><span class="note">Select menu, inline popovers anchored to a trigger</span></div>
<div class="row"><span class="tok">--z-overlay</span><span class="val">50</span><span class="note">Modal/popover scrim</span></div>
<div class="row"><span class="tok">--z-modal</span><span class="val">60</span><span class="note">Modal dialog, popover card — always above its own scrim</span></div>
<div class="row"><span class="tok">--z-tooltip</span><span class="val">70</span><span class="note">Hover tooltips — always above dialogs</span></div>
<div class="row"><span class="tok">--z-toast</span><span class="val">80</span><span class="note">Toast/notification stack — always topmost</span></div>
</div>
</div>
</body>
</html>
