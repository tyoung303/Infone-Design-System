<!doctype html>
<!-- @dsCard group="Type" name="Type · Display" subtitle="系统字体栈 700 / 48 hero specimen" viewport="700x260" -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Display Type</title>
<link rel="stylesheet" href="preview.css">
<style>
  .panel {
    background: var(--th-white);
    border: var(--th-border-card);
    border-radius: var(--th-radius-md);
    padding: 32px;
  }
  .hero {
    font-family: var(--th-font-cn);
    font-weight: 700;
    font-size: 48px;
    line-height: 1.1;
    color: var(--color-fg);
    letter-spacing: -0.01em;
  }
  .hero .light { font-weight: 400; }
  .meta {
    margin-top: 18px;
    display: flex;
    gap: 28px;
    font-family: var(--th-font-ui);
    font-size: 11px;
    color: var(--color-fg-muted);
  }
  .meta b { color: var(--color-fg); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="panel">
    <div class="hero">
      <span class="light">统一的</span><br>
      大模型接口网关
    </div>
    <div class="meta">
      <span>Family <b>系统字体栈（苹方 / 微软雅黑 / 黑体）</b></span>
      <span>Weight <b>700</b></span>
      <span>Size <b>48px</b></span>
      <span>Line <b>110%</b></span>
      <span>Align <b>centre</b> (marketing)</span>
    </div>
  </div>
</div>
</body>
</html>
