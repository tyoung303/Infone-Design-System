/* ── atoms ────────────────────────────────────────────────── */

function NCMField({ label, required, children }) {
  return (
    <div style={ncmStyles.field}>
      <span style={ncmStyles.fieldLabel}>
        {label}
        {required && <span style={ncmStyles.required}>*</span>}
      </span>
      {children}
    </div>
  );
}

function NCMSelect({ value, placeholder, options, onChange }) {
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (!wrapRef.current?.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  const current = options.find((o) => o.value === value);

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <button
        type="button"
        style={ncmStyles.select}
        onClick={() => setOpen((o) => !o)}
        aria-haspopup="listbox"
        aria-expanded={open}
      >
        <span style={{
          color: current ? "var(--color-fg)" : "var(--color-fg-muted)",
          fontWeight: current ? 500 : 400,
        }}>
          {current ? current.label : placeholder}
        </span>
        <i
          className="ri-arrow-down-s-line"
          style={{
            fontSize: 18, color: "var(--color-fg-muted)",
            transition: "transform .15s ease",
            transform: open ? "rotate(180deg)" : "none",
          }}
        />
      </button>
      {open && (
        <div style={ncmStyles.selectMenu} role="listbox">
          {options.map((o) => {
            const sel = o.value === value;
            return (
              <button
                key={o.value}
                role="option"
                aria-selected={sel}
                onClick={() => { onChange?.(o.value); setOpen(false); }}
                style={{
                  ...ncmStyles.selectOpt,
                  background: sel ? "var(--th-teal-50)" : "transparent",
                  color:      sel ? "var(--th-teal-700)" : "var(--color-fg)",
                  fontWeight: sel ? 600 : 400,
                }}
              >
                <span>{o.label}</span>
                {sel && <i className="ri-check-line" style={{ fontSize: 14 }} />}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function NCMModelSelect({ values, options, placeholder, onChange }) {
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (!wrapRef.current?.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  const toggle = (v) =>
    onChange?.(values.includes(v) ? values.filter((x) => x !== v) : [...values, v]);

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <div
        style={{ ...ncmStyles.select, minHeight: 44, height: "auto", padding: values.length ? "8px 12px" : "0 14px", flexWrap: "wrap", gap: 6, cursor: "text" }}
        onClick={() => setOpen(true)}
      >
        {values.length === 0 ? (
          <span style={{ color: "var(--color-fg-muted)" }}>{placeholder}</span>
        ) : (
          values.map((v) => (
            <span key={v} style={ncmStyles.modelChip}>
              {v}
              <button
                style={ncmStyles.modelChipX}
                onClick={(e) => { e.stopPropagation(); toggle(v); }}
                aria-label={"移除 " + v}
              ><i className="ri-close-line" style={{ fontSize: 12 }} /></button>
            </span>
          ))
        )}
        <span style={{ flex: 1, minWidth: 4 }} />
        <i
          className="ri-arrow-down-s-line"
          onClick={(e) => { e.stopPropagation(); setOpen((o) => !o); }}
          style={{ fontSize: 18, color: "var(--color-fg-muted)", marginLeft: "auto", cursor: "pointer", transition: "transform .15s ease", transform: open ? "rotate(180deg)" : "none" }}
        />
      </div>
      {open && (
        <div style={ncmStyles.selectMenu}>
          {options.map((o) => {
            const sel = values.includes(o);
            return (
              <button
                key={o}
                onClick={() => toggle(o)}
                style={{
                  ...ncmStyles.selectOpt,
                  background: sel ? "var(--th-teal-50)" : "transparent",
                  color:      sel ? "var(--th-teal-700)" : "var(--color-fg)",
                  fontWeight: sel ? 600 : 400,
                  fontFamily: "var(--th-font-mono)",
                  fontSize: 12,
                }}
              >
                <span>{o}</span>
                {sel && <i className="ri-check-line" style={{ fontSize: 14 }} />}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function NCMNumber({ value, onChange, min = 0, max = 100 }) {
  const clamp = (v) => Math.max(min, Math.min(max, Number(v) || 0));
  const step = (d) => onChange?.(clamp((Number(value) || 0) + d));
  return (
    <div style={ncmStyles.numberWrap}>
      <input
        type="number"
        value={value}
        onChange={(e) => onChange?.(e.target.value === "" ? "" : clamp(e.target.value))}
        onBlur={(e) => onChange?.(clamp(e.target.value))}
        min={min}
        max={max}
        style={ncmStyles.numberInput}
      />
      <div style={ncmStyles.numberSpinners}>
        <button type="button" style={ncmStyles.spinnerBtn} onClick={() => step(1)}  aria-label="增加">
          <i className="ri-arrow-up-s-line" />
        </button>
        <button type="button" style={ncmStyles.spinnerBtn} onClick={() => step(-1)} aria-label="减少">
          <i className="ri-arrow-down-s-line" />
        </button>
      </div>
    </div>
  );
}

<script type="text/babel">
/* EditChannelModal.jsx — 编辑渠道 dialog.
   Source: whiteboard sketch (uploads/whiteboard_exported_image (8).png).
   Reuses the NCM atoms (NCMField, NCMSelect, NCMNumber, NCMModelSelect)
   and ncmStyles from NewChannelModal.jsx so both dialogs read as the same
   visual family.

   Edit-specific additions on top of the create dialog:
   - Section-header card at top (icon + title + subtitle)
   - 密钥 field: muted hint in label + "查看密钥" pill below the input
   - "+ 添加键值对" rendered as filled brand-blue pill (more prominent than create)
   - Footer: 提交 (save icon) + 取消 (× icon)
   - No 默认测试模型 field
*/

/* Babel script tags don't share scope — pull shared atoms from window. */
const { NCMField, NCMSelect, NCMNumber, NCMModelSelect,
        NCM_CHANNEL_TYPES, NCM_MODEL_OPTIONS, ncmStyles } = window;

function EditChannelModal({ open, channel, onClose, onSave }) {
  const seed = channel || {};
  const [type, setType]         = React.useState("openai");
  const [name, setName]         = React.useState("");
  const [secret, setSecret]     = React.useState("");
  const [revealSecret, setRevealSecret] = React.useState(false);
  const [priority, setPriority] = React.useState(0);
  const [weight, setWeight]     = React.useState(0);
  const [apiUrl, setApiUrl]     = React.useState("");
  const [models, setModels]     = React.useState([]);
  const [customModel, setCustomModel] = React.useState("");
  const [redirectTab, setRedirectTab] = React.useState("visual");
  const [redirectPairs, setRedirectPairs] = React.useState([]);
  const [redirectText, setRedirectText]   = React.useState("");

  // Reseed state whenever the modal opens with a fresh channel.
  React.useEffect(() => {
    if (!open) return;
    setType(inferType(seed));
    setName(seed.name || "");
    setSecret("");
    setRevealSecret(false);
    setPriority(seed.priority ?? 0);
    setWeight(seed.weight ?? 0);
    setApiUrl(inferApi(seed));
    setModels(seed.models || []);
    setCustomModel("");
    setRedirectTab("visual");
    setRedirectPairs([]);
    setRedirectText("");
  }, [open, channel?.id]);

  React.useEffect(() => {
    if (!open) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") onClose?.(); };
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener("keydown", onKey);
    };
  }, [open, onClose]);

  if (!open) return null;

  const canSubmit = type && name.trim() && apiUrl.trim() && models.length > 0;

  const onSubmit = () => {
    if (!canSubmit) return;
    onSave?.({
      ...channel,
      name: name.trim(),
      models,
      priority: Math.max(0, Math.min(99, Number(priority) || 0)),
      weight:   Math.max(0, Math.min(100, Number(weight) || 0)),
    });
  };

  const addPair    = () => setRedirectPairs((p) => [...p, { id: Date.now() + Math.random(), from: "", to: "" }]);
  const updatePair = (id, k, v) => setRedirectPairs((p) => p.map((x) => x.id === id ? { ...x, [k]: v } : x));
  const removePair = (id) => setRedirectPairs((p) => p.filter((x) => x.id !== id));

  return (
    <div style={ncmStyles.scrim} onClick={onClose}>
      <div
        style={ncmStyles.dialog}
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
        aria-labelledby="ecm-title"
      >
        <header style={ncmStyles.head}>
          <h3 id="ecm-title" style={ncmStyles.title}>编辑渠道</h3>
          <button style={ncmStyles.closeBtn} onClick={onClose} aria-label="关闭">
            <i className="ri-close-line" />
          </button>
        </header>

        <div style={ncmStyles.body}>
          {/* Section header — 核心配置 */}
          <div style={ecmStyles.sectionHeader}>
            <span style={ecmStyles.sectionIcon}>
              <i className="ri-information-2-line" />
            </span>
            <div style={ecmStyles.sectionText}>
              <div style={ecmStyles.sectionTitle}>核心配置</div>
              <div style={ecmStyles.sectionSub}>编辑渠道所需的基本信息</div>
            </div>
          </div>

          {/* 类型 */}
          <NCMField label="类型" required>
            <NCMSelect
              value={type}
              placeholder="请选择渠道类型"
              options={NCM_CHANNEL_TYPES.map((t) => ({ value: t.key, label: t.label }))}
              onChange={setType}
            />
          </NCMField>

          {/* 名称 */}
          <NCMField label="名称" required>
            <input
              style={ncmStyles.input}
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="请输入渠道名称"
            />
          </NCMField>

          {/* 密钥 — special edit-mode label + 查看密钥 button */}
          <div style={ncmStyles.field}>
            <span style={ncmStyles.fieldLabel}>
              密钥
              <span style={ecmStyles.labelHint}>（编辑模式下，保存的密钥不会显示）</span>
            </span>
            <input
              style={{ ...ncmStyles.input, fontFamily: secret && !revealSecret ? "var(--th-font-cn)" : "var(--th-font-mono)" }}
              value={secret}
              onChange={(e) => setSecret(e.target.value)}
              placeholder="请输入渠道对应的鉴权密钥"
              type={revealSecret || !secret ? "text" : "password"}
              autoComplete="off"
            />
            <div>
              <button
                type="button"
                style={ecmStyles.viewSecretBtn}
                onClick={() => setRevealSecret((v) => !v)}
              >
                {revealSecret ? "隐藏密钥" : "查看密钥"}
              </button>
            </div>
          </div>

          {/* 渠道优先级 / 渠道权重 */}
          <div style={ncmStyles.twoCol}>
            <NCMField label="渠道优先级">
              <NCMNumber value={priority} onChange={setPriority} min={0} max={99} />
            </NCMField>
            <NCMField label="渠道权重">
              <NCMNumber value={weight} onChange={setWeight} min={0} max={100} />
            </NCMField>
          </div>

          {/* API 地址 */}
          <NCMField label="API 地址" required>
            <input
              style={{ ...ncmStyles.input, fontFamily: "var(--th-font-mono)" }}
              value={apiUrl}
              onChange={(e) => setApiUrl(e.target.value)}
              placeholder="https://"
            />
          </NCMField>

          <div style={ncmStyles.divider} />

          {/* 模型 */}
          <NCMField label="模型" required>
            <NCMModelSelect
              values={models}
              onChange={setModels}
              options={NCM_MODEL_OPTIONS}
              placeholder="请选择支持的模型"
            />
            <div style={ncmStyles.pillRow}>
              <button style={ncmStyles.pillActive} onClick={() => setModels(NCM_MODEL_OPTIONS.slice(0, 6))}>填入相关模型</button>
              <button style={ncmStyles.pillGhost}  onClick={() => setModels(NCM_MODEL_OPTIONS)}>获取模型列表</button>
              <button style={ncmStyles.pillGhost}>
                更多 <i className="ri-arrow-down-s-line" style={{ fontSize: 13, marginLeft: 2 }} />
              </button>
            </div>
          </NCMField>

          {/* 自定义模型名称 */}
          <NCMField label="自定义模型名称">
            <div style={ncmStyles.inlineFieldWrap}>
              <input
                style={ncmStyles.inlineFieldInput}
                value={customModel}
                onChange={(e) => setCustomModel(e.target.value)}
                placeholder="输入自定义模型名称"
              />
              <button
                style={ncmStyles.inlineFieldAction}
                onClick={() => {
                  const m = customModel.trim();
                  if (!m) return;
                  setModels((curr) => curr.includes(m) ? curr : [...curr, m]);
                  setCustomModel("");
                }}
                disabled={!customModel.trim()}
              >填入</button>
            </div>
          </NCMField>

          {/* 模型重定向 */}
          <NCMField label="模型重定向">
            <div style={ncmStyles.redirectBox}>
              <div style={ncmStyles.redirectHead}>
                <div style={ncmStyles.tabs}>
                  <button
                    style={{ ...ncmStyles.tab, ...(redirectTab === "visual" ? ncmStyles.tabActive : null) }}
                    onClick={() => setRedirectTab("visual")}
                  >可视化</button>
                  <span style={ncmStyles.tabDivider}>/</span>
                  <button
                    style={{ ...ncmStyles.tab, ...(redirectTab === "manual" ? ncmStyles.tabActive : null) }}
                    onClick={() => setRedirectTab("manual")}
                  >手动编辑</button>
                </div>
                <button
                  style={ncmStyles.templateLink}
                  onClick={() => {
                    if (redirectTab === "manual") {
                      setRedirectText('{\n  "gpt-4o": "claude-opus-4.7"\n}');
                    } else {
                      setRedirectPairs([
                        { id: 1, from: "gpt-4o",        to: "claude-opus-4.7" },
                        { id: 2, from: "gpt-3.5-turbo", to: "claude-haiku-4.5" },
                      ]);
                    }
                  }}
                >填入模板</button>
              </div>

              <div style={ncmStyles.redirectBody}>
                {redirectTab === "visual" ? (
                  redirectPairs.length === 0 ? (
                    <div style={ncmStyles.redirectEmpty}>
                      <div style={ncmStyles.redirectEmptyText}>暂无数据，点击下方按钮添加键值对</div>
                      {/* Edit-mode "+ 添加键值对" is the filled brand-blue accent. */}
                      <button style={ecmStyles.addPairFilled} onClick={addPair}>
                        <i className="ri-add-line" style={{ fontSize: 14 }} />
                        添加键值对
                      </button>
                    </div>
                  ) : (
                    <div style={ncmStyles.pairList}>
                      {redirectPairs.map((p) => (
                        <div key={p.id} style={ncmStyles.pairRow}>
                          <input
                            style={ncmStyles.pairInput}
                            value={p.from}
                            onChange={(e) => updatePair(p.id, "from", e.target.value)}
                            placeholder="请求中的模型名"
                          />
                          <i className="ri-arrow-right-line" style={ncmStyles.pairArrow} />
                          <input
                            style={ncmStyles.pairInput}
                            value={p.to}
                            onChange={(e) => updatePair(p.id, "to", e.target.value)}
                            placeholder="替换为的模型名"
                          />
                          <button style={ncmStyles.pairRemove} onClick={() => removePair(p.id)} aria-label="删除">
                            <i className="ri-delete-bin-6-line" />
                          </button>
                        </div>
                      ))}
                      <button style={{ ...ecmStyles.addPairFilled, alignSelf: "flex-start" }} onClick={addPair}>
                        <i className="ri-add-line" style={{ fontSize: 14 }} />
                        添加键值对
                      </button>
                    </div>
                  )
                ) : (
                  <textarea
                    style={ncmStyles.redirectTextarea}
                    value={redirectText}
                    onChange={(e) => setRedirectText(e.target.value)}
                    placeholder={'{\n  "gpt-4o": "claude-opus-4.7"\n}'}
                    spellCheck={false}
                  />
                )}
              </div>

              <div style={ncmStyles.redirectFootHint}>
                键为请求中的模型名称，值为要替换的模型名称
              </div>
            </div>
          </NCMField>
        </div>

        <footer style={ncmStyles.foot}>
          <button style={ncmStyles.cancelBtn} onClick={onClose}>
            <i className="ri-close-line" style={{ fontSize: 14 }} />
            取消
          </button>
          <button
            style={{
              ...ncmStyles.createBtn,
              opacity: canSubmit ? 1 : 0.5,
              cursor:  canSubmit ? "pointer" : "not-allowed",
            }}
            onClick={onSubmit}
            disabled={!canSubmit}
          >
            <i className="ri-save-line" style={{ fontSize: 14 }} />
            提交
          </button>
        </footer>
      </div>
    </div>
  );
}

/* ── helpers ──────────────────────────────────────────────── */
function inferType(ch) {
  if (!ch?.name) return "openai";
  const n = ch.name.toLowerCase();
  if (n.includes("anthropic"))  return "anthropic";
  if (n.includes("azure"))      return "azure";
  if (n.includes("gemini") || n.includes("vertex")) return "vertex";
  if (n.includes("deepseek"))   return "deepseek";
  if (n.includes("mistral"))    return "mistral";
  if (n.includes("qwen"))       return "qwen";
  if (n.includes("vllm"))       return "vllm";
  if (n.includes("ollama"))     return "ollama";
  return "openai";
}
function inferApi(ch) {
  const t = inferType(ch);
  switch (t) {
    case "anthropic": return "https://api.anthropic.com";
    case "azure":     return "https://eastus.api.cognitive.microsoft.com";
    case "vertex":    return "https://us-central1-aiplatform.googleapis.com";
    case "deepseek":  return "https://api.deepseek.com";
    case "mistral":   return "https://api.mistral.ai";
    case "qwen":      return "https://dashscope.aliyuncs.com";
    case "vllm":      return "http://localhost:8000/v1";
    case "ollama":    return "http://localhost:11434/v1";
    default:          return "https://api.openai.com/v1";
  }
}

/* ── edit-specific bits layered on top of ncmStyles ─────── */
const ecmStyles = {
  sectionHeader: {
    display: "flex", alignItems: "center", gap: 12,
    paddingBottom: 4,
  },
  sectionIcon: {
    width: 36, height: 36,
    borderRadius: 999,
    background: "var(--color-info-bg)",
    color: "var(--color-info-fg)",
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    fontSize: 16,
    flexShrink: 0,
  },
  sectionText: { display: "flex", flexDirection: "column", gap: 2, minWidth: 0 },
  sectionTitle: { fontSize: "var(--th-text-md)", fontWeight: 600, color: "var(--color-fg)" },
  sectionSub:   { fontSize: 12, color: "var(--color-fg-muted)" },

  labelHint: {
    fontSize: 12, fontWeight: 400,
    color: "var(--color-fg-muted)",
    marginLeft: 2,
  },

  viewSecretBtn: {
    appearance: "none", border: "none",
    height: 26, padding: "0 12px",
    borderRadius: "var(--th-radius-sm)",
    background: "var(--color-cta)",
    color: "var(--th-white)",
    fontFamily: "var(--th-font-cn)", fontSize: 12, fontWeight: 600,
    cursor: "pointer",
    display: "inline-flex", alignItems: "center", gap: 4,
    transition: "box-shadow .15s ease, transform .08s ease",
  },

  /* Filled brand-blue "+ 添加键值对" — the edit modal's prominent variant. */
  addPairFilled: {
    appearance: "none",
    display: "inline-flex", alignItems: "center", gap: 6,
    height: 38, padding: "0 16px",
    border: "none",
    borderRadius: "var(--th-radius-sm)",
    background: "var(--color-cta)",
    color: "var(--th-white)",
    fontFamily: "var(--th-font-cn)", fontSize: 13, fontWeight: 600,
    cursor: "pointer",
    transition: "box-shadow .15s ease, transform .08s ease",
  },
};

window.EditChannelModal = EditChannelModal;
</script>
<script type="text/babel">
/* ChannelManagement.jsx — 渠道管理 page.
   Source: whiteboard sketch provided by the user.
   Structure mirrors TokenManagement: toolbar + bordered table card.
   Visual vocabulary (status chip, link buttons, pink/green pills, progress bar
   inside a pill) is reused from the rest of the console.

   Columns (left → right):
     渠道           name + sub-models (e.g. Claude Opus 4.7 · Sonnet 4.6)
     状态           启用 / 禁用 dot-chip (matches TokenManagement StatusChip)
     响应时间       p50 in seconds, "—" when disabled
     成功率         success rate %, "—" when disabled
     已使用/总额度  used / total + percent + thin progress bar (green / amber / red)
     优先级         numeric priority pill
     权重           weight as muted number
     ─ ops cell ─   测试▼ split-button, 启用/禁用 toggle pill, 编辑, ⋯ menu
*/

const CHM_CHANNELS = [
  {
    id: 1, name: "Anthropic-Prod",
    models: ["Claude Opus 4.7", "Sonnet 4.6"],
    enabled: true, latency: 0.89, success: 99.91,
    currency: "$", used: 3200, total: 10000,
    priority: 1, weight: 100,
  },
  {
    id: 2, name: "OpenAI-Main",
    models: ["GPT-5", "GPT-4.1"],
    enabled: true, latency: 1.24, success: 99.84,
    currency: "$", used: 5800, total: 10000,
    priority: 1, weight: 80,
  },
  {
    id: 3, name: "Azure-East-2",
    models: ["GPT-4o", "GPT-4-Turbo"],
    enabled: true, latency: 1.58, success: 99.45,
    currency: "$", used: 952, total: 1000,
    priority: 2, weight: 40,
  },
  {
    id: 4, name: "Deepseek-Cn",
    models: ["DeepSeek-V3", "R1"],
    enabled: true, latency: 2.10, success: 99.20,
    currency: "¥", used: 920, total: 5000,
    priority: 2, weight: 60,
  },
  {
    id: 5, name: "Local-vLLM",
    models: ["Qwen3-72B", "Llama-4"],
    enabled: false, latency: null, success: null,
    unlimited: true, hint: "自建 · 无额度限制",
    priority: 3, weight: 20,
  },
  {
    id: 6, name: "Gemini-Vertex",
    models: ["Gemini 2.5 Pro"],
    enabled: true, latency: 1.05, success: 99.78,
    currency: "$", used: 2100, total: 5000,
    priority: 1, weight: 70,
  },
  {
    id: 7, name: "Mistral-EU",
    models: ["Mistral-Large-3", "Codestral"],
    enabled: true, latency: 1.32, success: 99.62,
    currency: "$", used: 410, total: 2000,
    priority: 3, weight: 30,
  },
  {
    id: 8, name: "Qwen-Cloud",
    models: ["Qwen-Max", "Qwen-Plus"],
    enabled: true, latency: 0.74, success: 99.88,
    currency: "¥", used: 1640, total: 8000,
    priority: 2, weight: 50,
  },
];

const CHM_STATUS_OPTIONS = [
  { key: "all",      label: "全部" },
  { key: "enabled",  label: "已启用" },
  { key: "disabled", label: "已禁用" },
  { key: "warning",  label: "异常" },
];

/* Pull modal components off window — Babel scripts don't share scope. */
const { NewChannelModal, EditChannelModal } = window;

function ChannelManagement() {
  const [rows, setRows]     = React.useState(CHM_CHANNELS);
  const [query, setQuery]   = React.useState("");
  const [status, setStatus] = React.useState("all");
  const [openMenu, setOpenMenu] = React.useState(null); // { id, kind: "test" | "more" }
  const [page, setPage]     = React.useState(1);
  const [createOpen, setCreateOpen] = React.useState(false);
  const [editing, setEditing] = React.useState(null);

  // Close any open menu when clicking outside or pressing Escape.
  React.useEffect(() => {
    if (!openMenu) return;
    const onDoc = (e) => {
      if (!e.target.closest?.("[data-chm-menu-anchor]")) setOpenMenu(null);
    };
    const onKey = (e) => { if (e.key === "Escape") setOpenMenu(null); };
    document.addEventListener("mousedown", onDoc);
    window.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      window.removeEventListener("keydown", onKey);
    };
  }, [openMenu]);

  const matchesStatus = (r) => {
    if (status === "all")      return true;
    if (status === "enabled")  return r.enabled;
    if (status === "disabled") return !r.enabled;
    if (status === "warning")  return r.enabled && !r.unlimited && r.total > 0 && (r.used / r.total) >= 0.9;
    return true;
  };
  const matchesQuery = (r) => {
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    return r.name.toLowerCase().includes(q) || r.models.some((m) => m.toLowerCase().includes(q));
  };

  const filtered = rows.filter((r) => matchesStatus(r) && matchesQuery(r));
  const PAGE_SIZE = 10;
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pageRows = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  const toggleEnabled = (r) =>
    setRows((curr) => curr.map((x) => x.id === r.id ? { ...x, enabled: !x.enabled } : x));
  const remove = (r) =>
    setRows((curr) => curr.filter((x) => x.id !== r.id));

  const onCreate = (data) => {
    setRows((curr) => [
      { id: Date.now(), ...data },
      ...curr,
    ]);
    setCreateOpen(false);
    setPage(1);
  };

  const onSaveEdit = (next) => {
    setRows((curr) => curr.map((x) => x.id === next.id ? { ...x, ...next } : x));
    setEditing(null);
  };

  return (
    <section style={chmStyles.wrap}>
      {/* Header — 新建渠道 (left) + status filter + search (right) */}
      <header style={chmStyles.toolbar}>
        <button style={chmStyles.newBtn} onClick={() => setCreateOpen(true)}>
          <i className="ri-add-line" style={{ fontSize: 14 }} />
          新建渠道
        </button>
        <div style={chmStyles.rightGroup}>
          <StatusFilter value={status} onChange={(v) => { setStatus(v); setPage(1); }} />
          <SearchBox value={query} onChange={(v) => { setQuery(v); setPage(1); }} />
        </div>
      </header>

      {/* Table card */}
      <div style={chmStyles.card}>
        <div style={chmStyles.scrollWrap}>
          {/* Head row */}
          <div style={{ ...chmStyles.row, ...chmStyles.headRow }}>
            <div>渠道</div>
            <div>状态</div>
            <div>响应时间</div>
            <div>成功率</div>
            <div>已使用 / 总额度</div>
            <div>优先级</div>
            <div>权重</div>
            <div style={{ ...chmStyles.opsHead, ...chmStyles.stickyRight, ...chmStyles.stickyRightHead }}>操作</div>
          </div>

          {pageRows.map((r) => {
            const disabled = !r.enabled;
            return (
              <div
                key={r.id}
                className="chm-row"
                style={{
                  ...chmStyles.row,
                  background: disabled ? "var(--th-bg)" : "var(--th-white)",
                }}
              >
                {/* 渠道 */}
                <div style={{ ...chmStyles.nameCell, opacity: disabled ? 0.55 : 1 }}>
                  <div style={chmStyles.nameTitle}>{r.name}</div>
                  <div style={chmStyles.nameSub}>{r.models.join(" · ")}</div>
                </div>

                {/* 状态 */}
                <div style={{ opacity: disabled ? 0.6 : 1 }}>
                  <ChmStatusChip enabled={r.enabled} />
                </div>

                {/* 响应时间 */}
                <div style={chmStyles.numCell}>
                  {r.latency == null ? <Dash /> : <span><b style={chmStyles.numBold}>{r.latency.toFixed(2)}</b> <span style={chmStyles.unit}>s</span></span>}
                </div>

                {/* 成功率 */}
                <div style={chmStyles.numCell}>
                  {r.success == null ? <Dash /> : <SuccessRate value={r.success} />}
                </div>

                {/* 已使用/总额度 */}
                <div>
                  <ChannelQuotaBar row={r} />
                </div>

                {/* 优先级 */}
                <div style={{ opacity: disabled ? 0.55 : 1 }}>
                  <PriorityPill value={r.priority} />
                </div>

                {/* 权重 */}
                <div style={{ ...chmStyles.weightCell, opacity: disabled ? 0.55 : 1 }}>
                  <span style={chmStyles.weightNum}>{r.weight}</span>
                  <span style={chmStyles.weightBar}>
                    <span style={{ ...chmStyles.weightBarFill, width: r.weight + "%" }} />
                  </span>
                </div>

                {/* 操作 — sticky w/ opaque bg so left columns slide under it on small viewports */}
                <div style={{
                  ...chmStyles.opsCell,
                  ...chmStyles.stickyRight,
                  ...(disabled ? chmStyles.stickyRightCellDisabled : chmStyles.stickyRightCellEnabled),
                }}>
                  <TestButton
                    open={openMenu?.id === r.id && openMenu?.kind === "test"}
                    onToggle={() => setOpenMenu((m) => m?.id === r.id && m?.kind === "test" ? null : { id: r.id, kind: "test" })}
                  />
                  <button
                    style={r.enabled ? chmStyles.disableChip : chmStyles.enableChip}
                    onClick={() => toggleEnabled(r)}
                  >{r.enabled ? "禁用" : "启用"}</button>
                  <button style={chmStyles.linkBtn} onClick={() => setEditing(r)}>编辑</button>
                  <MoreMenu
                    open={openMenu?.id === r.id && openMenu?.kind === "more"}
                    onToggle={() => setOpenMenu((m) => m?.id === r.id && m?.kind === "more" ? null : { id: r.id, kind: "more" })}
                    onDelete={() => { remove(r); setOpenMenu(null); }}
                  />
                </div>
              </div>
            );
          })}

          {pageRows.length === 0 && (
            <div style={chmStyles.empty}>
              <i className="ri-route-line" style={{ fontSize: 28, color: "var(--color-fg-subtle)" }} />
              <div style={{ marginTop: 12 }}>未找到匹配的渠道</div>
              <div style={chmStyles.emptyHint}>试试调整状态筛选或搜索关键字</div>
            </div>
          )}
        </div>

        {/* Footer */}
        <footer style={chmStyles.foot}>
          <span style={chmStyles.footMeta}>
            共 {filtered.length} 条，显示第 {filtered.length === 0 ? 0 : (page - 1) * PAGE_SIZE + 1}-{Math.min(filtered.length, page * PAGE_SIZE)} 条
          </span>
          <ThPager page={page} totalPages={totalPages} onChange={setPage} />
        </footer>
      </div>

      <NewChannelModal
        open={createOpen}
        onClose={() => setCreateOpen(false)}
        onCreate={onCreate}
      />

      <EditChannelModal
        open={!!editing}
        channel={editing}
        onClose={() => setEditing(null)}
        onSave={onSaveEdit}
      />
    </section>
  );
}

  const [open, setOpen] = React.useState(false);
  const current = CHM_STATUS_OPTIONS.find((o) => o.key === value) || CHM_STATUS_OPTIONS[0];

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (!e.target.closest?.("[data-chm-sf]")) setOpen(false); };

  }, [open]);

  return (
    <div data-chm-sf style={{ position: "relative" }}>
      <button
        style={chmStyles.filterBtn}
        onClick={() => setOpen((o) => !o)}
        aria-expanded={open}

                color:      o.key === value ? "var(--th-teal-700)" : "var(--color-fg)",
                fontWeight: o.key === value ? 600 : 400,

              onClick={() => { onChange?.(o.key); setOpen(false); }}

              {o.key === value && <i className="ri-check-line" style={{ fontSize: 14 }} />}

      <div style={chmStyles.quotaWrap}>

      </div>

/* Anchored-portal positioning hook. Tracks the button's screen rect while
   the menu is open, repositioning on scroll/resize so the dropdown stays
   pinned to the trigger even when the table scrolls horizontally. */
function usePortalAnchor(btnRef, open, side /* "left" | "right" */) {
  const [pos, setPos] = React.useState(null);
  React.useLayoutEffect(() => {
    if (!open || !btnRef.current) { setPos(null); return; }
    const measure = () => {
      const r = btnRef.current.getBoundingClientRect();
      if (side === "right") {
        setPos({ top: r.bottom + 6, right: window.innerWidth - r.right });
      } else {
        setPos({ top: r.bottom + 6, left: r.left });
      }
    };
    measure();
    window.addEventListener("scroll", measure, true);
    window.addEventListener("resize", measure);
    return () => {
      window.removeEventListener("scroll", measure, true);
      window.removeEventListener("resize", measure);
    };
  }, [open, side]);
  return pos;
}

/* ─────────────────────────────────────────────────────────────
   清除历史日志
   ───────────────────────────────────────────────────────────── */
function ClearLogsModal({ open, defaultValue, onClose, onConfirm }) {
  const [value, setValue] = React.useState(defaultValue || defaultClearDate());

  React.useEffect(() => {
    if (!open) return;
    setValue(defaultValue || defaultClearDate());
    const onKey = (e) => { if (e.key === "Escape") onClose?.(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, defaultValue, onClose]);

  if (!open) return null;

  return (
    <div style={clStyles.scrim} onMouseDown={onClose}>
      <div
        style={clStyles.dialog}
        onMouseDown={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
        aria-labelledby="ss-clear-title"
      >
        {/* Header */}
        <header style={clStyles.head}>
          <h2 id="ss-clear-title" style={clStyles.title}>清除历史日志</h2>
          <button style={clStyles.closeBtn} onClick={onClose} aria-label="关闭">
            <i className="ri-close-line" />
          </button>
        </header>

        {/* Body */}
        <div style={clStyles.body}>
          <label style={clStyles.fieldWrap}>
            <span style={clStyles.fieldValue}>{value}</span>
            <i className="ri-time-line" style={clStyles.fieldIcon} />
            <input
              type="datetime-local"
              value={toInputValue(value)}
              onChange={(e) => setValue(fromInputValue(e.target.value))}
              style={clStyles.fieldNative}
            />
          </label>
          <p style={clStyles.helper}>将清除选定时间之前的所有日志</p>
        </div>

        {/* Footer */}
        <footer style={clStyles.foot}>
          <button style={clStyles.cancelBtn} onClick={onClose}>取消</button>
          <button
            style={clStyles.dangerBtn}
            onClick={() => onConfirm?.(value)}
          >清除历史日志</button>
        </footer>
      </div>
    </div>
  );
}

function defaultClearDate() {
  // 30 days ago, top of the current minute → matches the spec mock.
  const d = new Date();
  d.setDate(d.getDate() - 30);
  return fmtDateTime(d);
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtDateTime(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
         " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
/* "2026-04-25 14:13:47" → "2026-04-25T14:13" (datetime-local) */
function toInputValue(v) {
  if (!v) return "";
  const [d, t = "00:00:00"] = v.split(" ");
  const [h, m] = t.split(":");
  return d + "T" + h + ":" + m;
}
/* "2026-04-25T14:13" → "2026-04-25 14:13:00" */
function fromInputValue(v) {
  if (!v) return "";
  const [d, t] = v.split("T");
  return d + " " + (t.length === 5 ? t + ":00" : t);
}

function NMField({ label, required, children }) {
  return (

  );

function toInputDT(v) {
  if (!v) return "";
  const [d, t = "00:00:00"] = v.split(" ");
  const [h, m] = t.split(":");
  return d + "T" + h + ":" + m;
}
function fromInputDT(v) {
  if (!v) return "";
  const [d, t] = v.split("T");
  return d + " " + (t.length === 5 ? t + ":00" : t);
}

function SSTypeChip({ type }) {
  const map = {

  };
  const { bg, fg } = map[type] || map["消费"];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center",
      height: 22, padding: "0 10px",
      background: bg, color: fg,
      borderRadius: "var(--th-radius-xs)",

    }}>{type}</span>
  );
}

function SSStatusChip({ status }) {
  const ok = status === "success";
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      height: 22, padding: "0 10px",

  );
}

            </div>
