<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../page-runtime/support.js"></script>
<style data-infone-responsive>
@media (max-width: 900px) {
  [style*="grid-template-columns:minmax(0,1fr) 292px"],
  [style*="grid-template-columns:minmax(0,1fr) 280px"] { grid-template-columns: minmax(0, 1fr) !important; }
}
@media (max-width: 680px) {
  [style*="grid-template-columns:minmax(0,1fr) 92px 84px"] { grid-template-columns: minmax(0, 1fr) !important; }
}
</style>
</head>
<body>
<x-dc>
<!-- @template name="Error Page" description="TokenHub 错误页 — 404/403/500, soft blob backdrop, brand lockup, single CTA" -->
<helmet>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="../../../tokens.css">
<script src="../../runtime/ds-bundle.js"></script>
<style>body{margin:0}</style>
</helmet>
<div style="position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--th-bg);font-family:var(--th-font-cn)">
<div style="position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; left: 108px; top: 120px; width: 420px; height: 420px; background-color: #93E8FF2E"></div>
<div style="position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;right:6%;top:20%;width:480px;height:480px;background:color-mix(in srgb, var(--th-teal-500) 14%, transparent)"></div>
<header style="position:relative;z-index:1;padding:24px 32px;display:flex;align-items:center;gap:10px">
<img src="../../../assets/tokenhub-logo.svg" style="width:22px" alt="">
<span style="font-family:var(--th-font-brand);font-weight:700;font-size:18px;color:var(--color-fg)">TokenHub</span>
</header>
<main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 20px 24px 60px; text-align: center; color: #191A1C">


<h1 style="font-size:22px;font-weight:600;margin:0;color:var(--color-fg)">{{ title }}</h1>
<p style="font-size: 13px;color:var(--color-fg-muted);max-width:360px;margin:0;line-height:1.5">{{ description }}</p>
<div style="display:flex;gap:12px;margin-top:8px">
<x-import component-from-global-scope="TokenHubDesignSystem_019e20.Button" on-click="{{ goHome }}" hint-size="112px,40px">返回首页</x-import>
<x-import component-from-global-scope="TokenHubDesignSystem_019e20.Button" variant="secondary" on-click="{{ contactSupport }}" hint-size="112px,40px">联系支持</x-import>
</div>
</main>
<footer style="position:relative;z-index:1;padding:16px;text-align:center;font-family:var(--th-font-ui);font-size:12px;color:var(--color-fg-muted)">TokenHub © 2026</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;errorType&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;404&quot;,&quot;tsType&quot;:&quot;\&quot;404\&quot;|\&quot;403\&quot;|\&quot;500\&quot;&quot;,&quot;options&quot;:[&quot;404&quot;,&quot;403&quot;,&quot;500&quot;]}}">
class Component extends DCLogic {
  CONTENT = {
    "404": { icon: "ri-compass-3-line", code: "404", title: "页面不存在", description: "你访问的地址可能已被移动或删除，检查链接是否正确。" },
    "403": { icon: "ri-shield-cross-line", code: "403", title: "无访问权限", description: "当前账号没有权限查看此页面，如需访问请联系管理员开通。" },
    "500": { icon: "ri-error-warning-line", code: "500", title: "服务器错误", description: "服务暂时不可用，我们已收到告警并正在处理，请稍后重试。" },
  };
  renderVals() {
    const c = this.CONTENT[this.props.errorType || "404"];
    return {
      ...c,
      goHome: () => { window.location.href = "../console-dashboard/index.html"; },
      contactSupport: () => {},
    };
  }
}
</script>
<style>
html,body{height:auto!important;min-height:100%;overflow-y:auto!important}
.infone-page-pager{position:fixed;z-index:2147483646;right:20px;bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px;min-width:min(520px,calc(100vw - 40px));padding:12px 16px;border:1px solid #e2e5ea;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(22,24,28,.14);backdrop-filter:blur(12px);font:13px/1.4 var(--th-font-ui,system-ui,sans-serif);color:#16181c}
.infone-page-pager a{display:grid;gap:2px;color:#16181c;text-decoration:none}.infone-page-pager a span{color:#676e7c;font-size:11px}.infone-page-pager-next{text-align:right}.infone-page-pager-count{color:#676e7c;white-space:nowrap}
@media(max-width:720px){.infone-page-pager{right:12px;bottom:12px;grid-template-columns:1fr auto 1fr;min-width:calc(100vw - 24px);padding:10px 12px}.infone-page-pager a strong{display:none}}
</style><nav class="infone-page-pager" aria-label="页面模式切换" title="上下滚动切换页面"><a class="infone-page-pager-previous" href="../empty-state-page/index.html"><span>上一个</span><strong>Empty State Page</strong></a><span class="infone-page-pager-count">4 / 14</span><a class="infone-page-pager-next" href="../form-page/index.html"><span>下一个</span><strong>Form Page</strong></a></nav><script>(()=>{const pager=document.querySelector(".infone-page-pager");if(!pager)return;const previous=pager.querySelector(".infone-page-pager-previous");const next=pager.querySelector(".infone-page-pager-next");const canScrollInDirection=(target,deltaY)=>{let element=target instanceof Element?target:null;while(element&&element!==document.documentElement){const overflowY=getComputedStyle(element).overflowY;if(/^(auto|scroll|overlay)$/.test(overflowY)&&element.scrollHeight>element.clientHeight){if(deltaY>0?element.scrollTop+element.clientHeight<element.scrollHeight-1:element.scrollTop>1)return true}element=element.parentElement}const scrollingElement=document.scrollingElement;if(!scrollingElement)return false;return deltaY>0?scrollingElement.scrollTop+scrollingElement.clientHeight<scrollingElement.scrollHeight-1:scrollingElement.scrollTop>1};let accumulatedDelta=0;let resetTimer=0;let navigating=false;addEventListener("wheel",event=>{if(navigating||event.ctrlKey||event.metaKey||Math.abs(event.deltaY)<=Math.abs(event.deltaX)||canScrollInDirection(event.target,event.deltaY))return;const candidate=event.deltaY>0?next:previous;if(!candidate)return;event.preventDefault();const multiplier=event.deltaMode===WheelEvent.DOM_DELTA_LINE?16:event.deltaMode===WheelEvent.DOM_DELTA_PAGE?innerHeight:1;accumulatedDelta+=event.deltaY*multiplier;clearTimeout(resetTimer);resetTimer=window.setTimeout(()=>{accumulatedDelta=0},180);if(Math.abs(accumulatedDelta)<48)return;const destination=accumulatedDelta>0?next:previous;if(!destination){accumulatedDelta=0;return}navigating=true;location.assign(destination.href)},{passive:false})})();</script>
</body>
</html>
