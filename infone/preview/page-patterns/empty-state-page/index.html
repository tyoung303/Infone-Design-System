<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../page-runtime/support.js"></script>
<style data-infone-responsive>
@media (max-width: 900px) {
  [style*="grid-template-columns:minmax(0,1fr) 292px"],
  [style*="grid-template-columns:minmax(0,1fr) 280px"] { grid-template-columns: minmax(0, 1fr) !important; }
}
@media (max-width: 680px) {
  [style*="grid-template-columns:minmax(0,1fr) 92px 84px"] { grid-template-columns: minmax(0, 1fr) !important; }
}
</style>
</head>
<body>
<x-dc>
<!-- @template name="Empty State Page" description="空状态页 — 标准骨架 + 首次进入无数据的整页引导（EmptyState + 快速上手入口）" -->
<helmet>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="../../../tokens.css">
<script src="../../runtime/ds-bundle.js"></script>
<link rel="stylesheet" href="../../../fonts/remixicon.css">
<style>body{margin:0;background:var(--th-bg)}</style>
</helmet>
<div style="display:flex;min-height:100vh;background:var(--th-bg);font-family:var(--th-font-cn);color:var(--color-fg)" data-screen-label="空状态引导页">
<x-import component-from-global-scope="TokenHubDesignSystem_019e20.NavRail" hint-size="240px,100vh" logo-src="../../../assets/tokenhub-logo.svg" brand="InfOne" groups="{{ navGroups }}" active="{{ activeNav }}" on-change="{{ setNav }}" user="admin" collapsed="{{ collapsed }}" on-toggle="{{ toggle }}"></x-import>
<main style="flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:12px">
<x-import component-from-global-scope="TokenHubDesignSystem_019e20.PageHeader" variant="page" title="令牌管理" hint-size="100%,56px"></x-import>
<div style="background:var(--th-white);border:var(--th-border-card);border-radius:var(--th-radius-md);box-shadow:var(--th-shadow-card);padding:48px 16px;display:flex;justify-content:center">
<x-import component-from-global-scope="TokenHubDesignSystem_019e20.EmptyState" icon="ri-key-2-line" title="还没有令牌" description="创建第一把令牌后，即可用统一密钥调用全部上游模型。" action="{{ emptyAction }}" hint-size="320px,180px"></x-import>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<sc-for list="{{ guides }}" as="g" hint-placeholder-count="3">
<div style="background:var(--th-white);border:var(--th-border-card);border-radius:var(--th-radius-md);padding:12px;display:flex;flex-direction:column;gap:8px">
<span style="width:32px;height:32px;border-radius:8px;background:var(--th-teal-50);color:var(--th-teal-600);display:inline-flex;align-items:center;justify-content:center;font-size:16px"><i class="{{ g.icon }}"></i></span>
<div style="font-size:13px;font-weight:600">{{ g.title }}</div>
<div style="font-size:12px;color:var(--color-fg-muted);line-height:1.5">{{ g.desc }}</div>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeNav: "tokens", collapsed: false };
  renderVals() {
    const DS = window.TokenHubDesignSystem_019e20 || {};
    return {
      activeNav: this.state.activeNav,
      setNav: (k) => this.setState({ activeNav: k }),
      collapsed: this.state.collapsed,
      toggle: () => this.setState((s) => ({ collapsed: !s.collapsed })),
      navGroups: [{ title: "令牌中心", items: [
        { key: "tokens", icon: "ri-key-2-line", label: "令牌管理" },
        { key: "quota", icon: "ri-pie-chart-2-line", label: "额度管理" },
        { key: "models", icon: "ri-store-2-line", label: "模型广场" },
      ]}],
      emptyAction: DS.Button ? React.createElement(DS.Button, { icon: "ri-add-line", onClick: () => {} }, "新建令牌") : null,
      guides: [
        { icon: "ri-key-2-line", title: "创建令牌", desc: "为团队或环境分别发放密钥，支持按模型限定范围。" },
        { icon: "ri-swap-line", title: "替换接口地址", desc: "将 SDK 的 base URL 指向 TokenHub 网关，一行改动。" },
        { icon: "ri-line-chart-line", title: "查看用量", desc: "调用后在用量日志中跟踪请求、消耗与延迟。" },
      ],
    };
  }
}
</script>
<style>
html,body{height:auto!important;min-height:100%;overflow-y:auto!important}
.infone-page-pager{position:fixed;z-index:2147483646;right:20px;bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px;min-width:min(520px,calc(100vw - 40px));padding:12px 16px;border:1px solid #e2e5ea;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(22,24,28,.14);backdrop-filter:blur(12px);font:13px/1.4 var(--th-font-ui,system-ui,sans-serif);color:#16181c}
.infone-page-pager a{display:grid;gap:2px;color:#16181c;text-decoration:none}.infone-page-pager a span{color:#676e7c;font-size:11px}.infone-page-pager-next{text-align:right}.infone-page-pager-count{color:#676e7c;white-space:nowrap}
@media(max-width:720px){.infone-page-pager{right:12px;bottom:12px;grid-template-columns:1fr auto 1fr;min-width:calc(100vw - 24px);padding:10px 12px}.infone-page-pager a strong{display:none}}
</style><nav class="infone-page-pager" aria-label="页面模式切换" title="上下滚动切换页面"><a class="infone-page-pager-previous" href="../detail-page/index.html"><span>上一个</span><strong>Detail Page</strong></a><span class="infone-page-pager-count">3 / 14</span><a class="infone-page-pager-next" href="../error-page/index.html"><span>下一个</span><strong>Error Page</strong></a></nav><script>(()=>{const pager=document.querySelector(".infone-page-pager");if(!pager)return;const previous=pager.querySelector(".infone-page-pager-previous");const next=pager.querySelector(".infone-page-pager-next");const canScrollInDirection=(target,deltaY)=>{let element=target instanceof Element?target:null;while(element&&element!==document.documentElement){const overflowY=getComputedStyle(element).overflowY;if(/^(auto|scroll|overlay)$/.test(overflowY)&&element.scrollHeight>element.clientHeight){if(deltaY>0?element.scrollTop+element.clientHeight<element.scrollHeight-1:element.scrollTop>1)return true}element=element.parentElement}const scrollingElement=document.scrollingElement;if(!scrollingElement)return false;return deltaY>0?scrollingElement.scrollTop+scrollingElement.clientHeight<scrollingElement.scrollHeight-1:scrollingElement.scrollTop>1};let accumulatedDelta=0;let resetTimer=0;let navigating=false;addEventListener("wheel",event=>{if(navigating||event.ctrlKey||event.metaKey||Math.abs(event.deltaY)<=Math.abs(event.deltaX)||canScrollInDirection(event.target,event.deltaY))return;const candidate=event.deltaY>0?next:previous;if(!candidate)return;event.preventDefault();const multiplier=event.deltaMode===WheelEvent.DOM_DELTA_LINE?16:event.deltaMode===WheelEvent.DOM_DELTA_PAGE?innerHeight:1;accumulatedDelta+=event.deltaY*multiplier;clearTimeout(resetTimer);resetTimer=window.setTimeout(()=>{accumulatedDelta=0},180);if(Math.abs(accumulatedDelta)<48)return;const destination=accumulatedDelta>0?next:previous;if(!destination){accumulatedDelta=0;return}navigating=true;location.assign(destination.href)},{passive:false})})();</script>
</body>
</html>
